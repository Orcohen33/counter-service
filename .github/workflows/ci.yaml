name: Counter Service CI

on:
  push: # For testing
    branches: [main, dev]
    paths:
      - "app/**"
  pull_request:
    branches: [main, dev]
    paths:
      - "app/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        working-directory: ./app
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install -r requirements.txt

      - name: Lint with flake8
        working-directory: ./app
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run tests
        working-directory: ./app
        run: |
          pytest -v || echo "No tests found or tests failed"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./app
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/counter-service:${{ github.sha }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/counter-service:latest

      - name: Update Kubernetes manifests
        if: github.event_name != 'pull_request' # && github.ref == 'refs/heads/main'
        run: |
          # Update the image tag in deployment.yaml
          sed -i "s|image: .*/counter-service:.*|image: ${{ secrets.DOCKER_HUB_USERNAME }}/counter-service:${{ github.sha }}|g" k8s/deployment.yaml

          # Verify the change
          echo "Updated deployment.yaml:"
          grep "image:" k8s/deployment.yaml

      - name: Commit and push manifest changes
        if: github.event_name != 'pull_request' # && github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add k8s/deployment.yaml

          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update counter-service image tag to ${{ github.sha }}"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
